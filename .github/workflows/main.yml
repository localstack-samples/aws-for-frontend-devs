name: Deploy on LocalStack

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example:
          - s3
          - cf-s3
          - lambda
          - api-gateway
          - dynamodb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lstk and the CDK CLI
        run: |
          npm install -g @localstack/lstk aws-cdk
          lstk setup aws --force --non-interactive

      - name: Install dependencies
        working-directory: ${{ matrix.example }}
        run: npm ci

      - name: Start LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: lstk start

      - name: Deploy the example
        run: make deploy EXAMPLE=${{ matrix.example }}

      - name: Run tests
        run: make test EXAMPLE=${{ matrix.example }}

      - name: Show LocalStack logs
        if: failure()
        run: lstk logs | tail -300
